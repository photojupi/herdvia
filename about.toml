# cargo-about configuration for THIRD-PARTY-LICENSES.html in release zips.
# `accepted` lists only the licenses that the current dependency tree
# actually needs, in order of preference.
accepted = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

# Leave herdvia itself out of the third-party list
# (takes effect because Cargo.toml has `publish = false`).
private = { ignore = true }

# Only the platforms we ship.
targets = [
    "aarch64-apple-darwin",
    "x86_64-pc-windows-gnu",
]

# Clarifications
#
# Without these, cargo-about falls back to the generic SPDX text (with a
# "<copyright holders>" placeholder) for crates whose license file it cannot
# find or identify. Each entry points at the crate's real license text and
# pins it with a SHA-256 checksum. If a dependency update changes the file,
# the checksum no longer matches, cargo-about prints a warning and the
# release workflow fails, so these must be refreshed after `cargo update`.
#
# `files` paths are inside the published crate (read offline).
# `git` paths are relative to the crate's repository root, fetched from
# raw.githubusercontent.com at the commit recorded in .cargo_vcs_info.json.
#
# Not clarified: objc2, block2, dispatch2, objc2-encode, objc2-* framework
# crates and enum-assoc. Neither their packages nor their repositories carry
# a license text with a copyright line, so the generic text stays and the
# template links to each crate's repository.

# n0 crates: the MIT text lives only at the repository root.
[iroh.clarify]
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"

[[iroh.clarify.git]]
path = "LICENSE-MIT"
license = "MIT"
checksum = "f169adb8124d3b005416d8485d00777c9a7bdd9099982c52a4493f9732e6d050"

# Code derived from Tailscale, shipped inside the crate.
[[iroh.clarify.files]]
path = "LICENSE-BSD3"
license = "BSD-3-Clause"
checksum = "7c6c032bf8c84fb4cd99784965a39be9e836fb7f244b3cf40c42faf4b211c10a"

