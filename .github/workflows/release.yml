name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_ABOUT_VERSION: 0.9.3

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Tag must match Cargo.toml version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
          echo "tag $TAG matches version $version"

  build-macos:
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin

      # Same unit tests as CI, so a tag on an untested commit does not ship.
      - name: Unit tests
        run: cargo test --locked --lib --bins

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin --locked

      - uses: actions/upload-artifact@v7
        with:
          name: bin-macos-arm64
          path: target/aarch64-apple-darwin/release/herdvia
          if-no-files-found: error

  build-windows:
    needs: check-version
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-gnu

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-gnu --locked

      - name: Strip
        run: x86_64-w64-mingw32-strip target/x86_64-pc-windows-gnu/release/herdvia.exe

      - uses: actions/upload-artifact@v7
        with:
          name: bin-windows-x64
          path: target/x86_64-pc-windows-gnu/release/herdvia.exe
          if-no-files-found: error

  package:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-about
        run: cargo install --locked --features cli "cargo-about@$CARGO_ABOUT_VERSION"

      # Not --frozen: the `git` clarifications in about.toml fetch license files from
      # raw.githubusercontent.com. A clarification that fails (fetch error or checksum
      # mismatch) is only a warning, so any cargo-about output on stderr fails the step.
      - name: Generate THIRD-PARTY-LICENSES.html
        run: |
          cargo about generate --locked --fail -o THIRD-PARTY-LICENSES.html about.hbs 2> about.log || { cat about.log; exit 1; }
          if [ -s about.log ]; then
            cat about.log
            echo "::error::cargo-about reported warnings"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: bin-macos-arm64
          path: bin/macos-arm64

      - uses: actions/download-artifact@v8
        with:
          name: bin-windows-x64
          path: bin/windows-x64

      - name: Create zips and SHA256SUMS
        run: |
          mkdir dist
          # Artifact upload drops the executable bit.
          chmod +x bin/macos-arm64/herdvia
          zip -j dist/herdvia-macos-arm64.zip bin/macos-arm64/herdvia \
            README.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.html
          zip -j dist/herdvia-windows-x64.zip bin/windows-x64/herdvia.exe \
            README.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.html
          cp scripts/install.sh scripts/install.ps1 dist/
          cd dist
          sha256sum herdvia-macos-arm64.zip herdvia-windows-x64.zip install.sh install.ps1 > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --verify-tag \
            --generate-notes \
            dist/herdvia-macos-arm64.zip dist/herdvia-windows-x64.zip \
            dist/install.sh dist/install.ps1 dist/SHA256SUMS
