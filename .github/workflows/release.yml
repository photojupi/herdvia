name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_ABOUT_VERSION: 0.9.3

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag must match Cargo.toml version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
          echo "tag $TAG matches version $version"

  build-macos:
    needs: check-version
    runs-on: macos-latest
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin

      # Same unit tests as CI, so a tag on an untested commit does not ship.
      - name: Unit tests
        run: cargo test --locked --lib --bins

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin --locked

      # The package job checks the binary it downloads against this job output (see there).
      - name: Hash
        id: hash
        run: echo "sha256=$(shasum -a 256 target/aarch64-apple-darwin/release/herdvia | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-macos-arm64
          path: target/aarch64-apple-darwin/release/herdvia
          if-no-files-found: error

  build-windows:
    needs: check-version
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-gnu

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-gnu --locked

      - name: Strip
        run: x86_64-w64-mingw32-strip target/x86_64-pc-windows-gnu/release/herdvia.exe

      # The package job checks the binary it downloads against this job output (see there).
      - name: Hash
        id: hash
        run: echo "sha256=$(sha256sum target/x86_64-pc-windows-gnu/release/herdvia.exe | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-windows-x64
          path: target/x86_64-pc-windows-gnu/release/herdvia.exe
          if-no-files-found: error

  # Builds and runs cargo-about and its dependency tree here, not in the package job: a
  # malicious crate among them gets no id-token or attestations permission to sign with.
  # It can still delete and re-upload other artifacts of this run, so the package and release
  # jobs check what they download against hashes passed as job outputs.
  licenses:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-about
        run: cargo install --locked --features cli "cargo-about@$CARGO_ABOUT_VERSION"

      # Not --frozen: the `git` clarifications in about.toml fetch license files from
      # raw.githubusercontent.com. A clarification that fails (fetch error or checksum
      # mismatch) is only a warning, so any cargo-about output on stderr fails the step.
      - name: Generate THIRD-PARTY-LICENSES.html
        run: |
          cargo about generate --locked --fail -o THIRD-PARTY-LICENSES.html about.hbs 2> about.log || { cat about.log; exit 1; }
          if [ -s about.log ]; then
            cat about.log
            echo "::error::cargo-about reported warnings"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES.html
          if-no-files-found: error

  package:
    needs: [build-macos, build-windows, licenses]
    runs-on: ubuntu-latest
    outputs:
      sums-sha256: ${{ steps.zip.outputs.sums-sha256 }}
    # id-token and attestations: for the build provenance step below.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
          path: licenses

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-macos-arm64
          path: bin/macos-arm64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-windows-x64
          path: bin/windows-x64

      # Any job of this run can replace an artifact (delete it and upload another under the
      # same name), including the licenses job running cargo-about. Job outputs cannot be
      # changed by other jobs, so the binaries must match the hashes the build jobs computed.
      - name: Check binaries against build job hashes
        env:
          MACOS_SHA256: ${{ needs.build-macos.outputs.sha256 }}
          WINDOWS_SHA256: ${{ needs.build-windows.outputs.sha256 }}
        run: |
          printf '%s  %s\n' "$MACOS_SHA256" bin/macos-arm64/herdvia \
            "$WINDOWS_SHA256" bin/windows-x64/herdvia.exe | sha256sum --strict -c

      - name: Create zips and SHA256SUMS
        id: zip
        run: |
          mkdir dist
          # Artifact upload drops the executable bit.
          chmod +x bin/macos-arm64/herdvia
          zip -j dist/herdvia-macos-arm64.zip bin/macos-arm64/herdvia \
            README.md LICENSE-MIT LICENSE-APACHE licenses/THIRD-PARTY-LICENSES.html
          zip -j dist/herdvia-windows-x64.zip bin/windows-x64/herdvia.exe \
            README.md LICENSE-MIT LICENSE-APACHE licenses/THIRD-PARTY-LICENSES.html
          cp scripts/install.sh scripts/install.ps1 dist/
          cd dist
          sha256sum herdvia-macos-arm64.zip herdvia-windows-x64.zip install.sh install.ps1 > SHA256SUMS
          cat SHA256SUMS
          echo "sums-sha256=$(sha256sum SHA256SUMS | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      # Signed provenance for every file the release job publishes, checked with
      # `gh attestation verify <file> --repo photojupi/herdvia
      # --signer-workflow photojupi/herdvia/.github/workflows/release.yml`. Nothing changes dist/
      # after this step: the release job uploads these files as they are.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/herdvia-macos-arm64.zip
            dist/herdvia-windows-x64.zip
            dist/install.sh
            dist/install.ps1
            dist/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # The same artifact replacement as in the package job: SHA256SUMS must match the
      # package job output, and every published file must match SHA256SUMS.
      - name: Check dist against package job hash
        env:
          SUMS_SHA256: ${{ needs.package.outputs.sums-sha256 }}
        working-directory: dist
        run: |
          printf '%s  SHA256SUMS\n' "$SUMS_SHA256" | sha256sum --strict -c
          sha256sum --strict -c SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --verify-tag \
            --generate-notes \
            dist/herdvia-macos-arm64.zip dist/herdvia-windows-x64.zip \
            dist/install.sh dist/install.ps1 dist/SHA256SUMS
