name: Audit

# Checks Cargo.lock against the RustSec advisory database. Not on pull_request: a new advisory
# would otherwise fail unrelated PRs.
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - .github/workflows/audit.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_AUDIT_VERSION: 0.23.0

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-audit
        run: cargo install --locked "cargo-audit@$CARGO_AUDIT_VERSION"

      # RUSTSEC-2024-0436: paste is unmaintained, with no fixed version. It is a build-time
      # proc-macro that iroh pulls in on Linux only (netwatch -> netlink-packet-core); it is not
      # in the macOS or Windows release binaries.
      #
      # RUSTSEC-2026-0543: chrono is unmaintained, with no fixed version. This is a notice, not a
      # vulnerability. iroh pulls it in on Windows only (netwatch -> wmi, whose default features
      # include chrono), so it is in the Windows release binary and not in the macOS one. herdvia
      # cannot turn that feature off; drop this once netwatch or wmi stops depending on chrono.
      - name: cargo audit
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0543
