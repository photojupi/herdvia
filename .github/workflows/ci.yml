name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --locked --lib --bins

      # The integration tests in tests/ that do not need the public n0 relay or address lookup.
      # Every other one needs n0 to connect, so it runs in integration.yml instead of here.
      # Listed by exact name, so a new test joins this step only when added here.
      - name: Integration tests (no connection)
        run: |
          cargo test --locked --test doctor -- --exact \
            creates_nothing_for_a_missing_data_directory \
            fails_without_an_agent_and_reads_the_existing_identity \
            fails_on_a_malformed_peer_list \
            an_unreadable_key_points_to_a_new_identity_not_a_backup \
            reports_the_running_agents_version_and_executable \
            fails_within_the_timeout_when_the_agent_does_not_answer \
            warns_within_the_timeout_when_status_or_pending_does_not_answer \
            an_old_agent_is_told_apart_from_a_stuck_one \
            fails_on_a_data_directory_this_user_cannot_open \
            does_not_run_a_core_found_only_through_a_relative_or_empty_path_entry \
            fails_on_a_missing_data_directory_below_a_directory_others_can_write \
            fails_on_dot_dot_after_a_missing_directory_and_creates_nothing \
            says_why_each_peer_is_not_connected
          cargo test --locked --test peers -- --exact \
            wide_secret_key_permission_refuses_start \
            wide_peers_permission_refuses_start \
            id_prints_endpoint_id_and_fingerprint_stably \
            status_without_agent_is_255 \
            allow_rejects_bad_name_bad_id_and_missing_flag \
            allow_and_revoke_update_file_without_agent \
            revoke_of_an_unknown_name_fails_and_changes_nothing \
            one_endpoint_id_cannot_take_a_second_name \
            revoke_warns_when_the_endpoint_id_is_still_allowed_under_another_name \
            a_data_directory_below_a_directory_others_can_write_is_refused \
            revoke_fails_when_the_running_agent_never_answers_the_reload \
            revoke_keeps_the_duplicate_key_warning_when_the_agent_answers_an_error \
            allow_and_accept_fail_when_the_agent_answers_an_error \
            agent_reload_reports_a_confirmed_reload \
            agent_reload_without_an_agent_is_255_and_creates_nothing \
            peers_lists_saved_peers_without_an_agent_and_creates_nothing \
            allow_warns_when_a_name_moves_to_another_key \
            status_explains_why_peers_are_not_connected \
            status_falls_back_to_the_table_when_the_agent_does_not_know_status_detail \
            status_falls_back_to_the_table_on_an_agent_that_drops_status_detail \
            status_fails_when_the_agent_answers_status_detail_with_another_error
          cargo test --locked --test pending -- --exact \
            accept_refuses_a_full_pending_list
          cargo test --locked --test transport -- --exact \
            no_agent_means_immediate_255 \
            stale_socket_means_immediate_255 \
            permissions_when_agent_creates_dir \
            permissions_when_dir_is_too_open \
            agent_and_via_refuse_a_data_directory_below_a_directory_others_can_write
          cargo test --locked --test pair -- --exact \
            listen_and_connect_fail_without_running_agent \
            connect_refuses_duplicate_peer_name_before_dialing \
            lan_discovery_pairs_two_local_agents_registers_hc_and_passes_traffic \
            status_shows_the_reason_a_peer_gave_for_rejecting_this_pc \
            declining_or_eof_on_listen_leaves_peers_empty_and_exits_one \
            approval_on_the_target_saves_nothing_on_the_caller_until_its_user_confirms \
            connect_with_eof_stdin_when_no_lan_peer_cancels_with_exit_one_and_docs_match_contract \
            a_blank_line_at_the_lan_menu_cancels_and_other_input_is_an_error \
            connect_keeps_an_agent_frame_split_around_the_confirmation_answer \
            listen_keeps_an_agent_frame_split_around_the_allow_answer

  windows-cross:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add x86_64-pc-windows-gnu

      - name: Clippy (Windows)
        run: cargo clippy --target x86_64-pc-windows-gnu --all-targets --locked -- -D warnings

      # Release only: debug builds fail to link on windows-gnu because iroh also builds a cdylib.
      - name: Build (Windows, release)
        run: cargo build --release --target x86_64-pc-windows-gnu --locked

      # For the install-ps1 job.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: herdvia-windows-x64
          path: target/x86_64-pc-windows-gnu/release/herdvia.exe
          if-no-files-found: error

  # Runs the cfg(windows) unit tests on Windows. With the MSVC toolchain the runner has: the
  # windows-gnu release build is cross-compiled on Linux, and its debug builds fail to link.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # The unit tests make data folders in the temporary folder, and herdvia refuses one whose
      # parent folders another account may change. The runner's %TEMP% is not known to pass, so
      # they use a new folder in the profile, as src/ipc/windows.rs's own tests do.
      - name: Use a temporary folder in the profile
        run: |
          $temp = Join-Path $env:LOCALAPPDATA "herdvia-tests"
          New-Item -ItemType Directory -Force $temp | Out-Null
          "TMP=$temp" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TEMP=$temp" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Unit tests
        run: cargo test --locked --lib --bins

  install-sh:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build (release)
        run: cargo build --release --locked

      # Serves a release built like release.yml's from a local server. HERDVIA_NO_AGENT=1:
      # whether launchd accepts an agent on the runner is unknown.
      - name: Test scripts/install.sh
        run: |
          set -u
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          # Short, because HERDVIA_DIR below holds the agent socket.
          work=$(mktemp -d /tmp/hv.XXXXXX)
          mkdir -p "$work/srv/good" "$work/srv/bad" "$work/home" "$work/fake"
          echo test > "$work/THIRD-PARTY-LICENSES.html"
          zip -j "$work/srv/good/herdvia-macos-arm64.zip" target/release/herdvia \
            README.md LICENSE-MIT LICENSE-APACHE "$work/THIRD-PARTY-LICENSES.html"
          cp scripts/install.sh scripts/install.ps1 "$work/srv/good/"
          (cd "$work/srv/good" && shasum -a 256 herdvia-macos-arm64.zip install.sh install.ps1 > SHA256SUMS)
          # A changed archive under the good archive's checksum.
          printf '#!/bin/sh\necho fake\n' > "$work/fake/herdvia"
          chmod +x "$work/fake/herdvia"
          zip -j "$work/srv/bad/herdvia-macos-arm64.zip" "$work/fake/herdvia"
          cp "$work/srv/good/SHA256SUMS" "$work/srv/bad/"

          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$work/srv" > "$work/http.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          base=http://127.0.0.1:8765
          for _ in $(seq 50); do
            if curl -fs -o /dev/null "$base/good/SHA256SUMS"; then break; fi
            sleep 0.2
          done
          curl -fsS -o /dev/null "$base/good/SHA256SUMS"

          home=$work/home
          exe=$home/.local/bin/herdvia
          line='export PATH="$HOME/.local/bin:$PATH"'
          check() {
            if "$@"; then echo "ok: $*"; else echo "::error::check failed: $*"; exit 1; fi
          }
          # run_install <release folder> <command...>: a clean environment like a new login.
          run_install() {
            release=$1
            shift
            env -i HOME="$home" PATH=/usr/bin:/bin:/usr/sbin:/sbin SHELL=/bin/zsh \
              HERDVIA_RELEASE_BASE="$base/$release" HERDVIA_DIR="$work/d" HERDVIA_NO_AGENT=1 "$@"
          }

          echo "--- new install"
          run_install good sh scripts/install.sh > "$work/out1" 2>&1 || { cat "$work/out1"; exit 1; }
          cat "$work/out1"
          check test -f "$exe"
          check test "$(stat -f %Lp "$exe")" = 755
          check test "$(ls -A "$home/.local/bin")" = herdvia
          check test "$("$exe" --version)" = "herdvia $version"
          check grep -qx "Installed herdvia $version at $exe" "$work/out1"
          check test "$(grep -cxF "$line" "$home/.zprofile")" = 1
          check grep -qF "releases.herdr.dev/core/install.sh" "$work/out1"
          id=$(HERDVIA_DIR="$work/d" "$exe" id)
          check grep -qxF "$(echo "$id" | head -n 1)" "$work/out1"

          echo "--- upgrade through curl | sh"
          run_install good sh -c "curl -fsSL '$base/good/install.sh' | sh" > "$work/out2" 2>&1 || { cat "$work/out2"; exit 1; }
          cat "$work/out2"
          check grep -qx "Upgraded herdvia $version at $exe" "$work/out2"
          check test "$(grep -cxF "$line" "$home/.zprofile")" = 1
          check test "$(ls -A "$home/.local/bin")" = herdvia
          check test "$(HERDVIA_DIR="$work/d" "$exe" id)" = "$id"

          echo "--- checksum mismatch"
          if run_install bad sh scripts/install.sh > "$work/out3" 2>&1; then
            cat "$work/out3"
            echo "::error::install succeeded despite a checksum mismatch"
            exit 1
          fi
          cat "$work/out3"
          check grep -q "checksum mismatch" "$work/out3"
          check cmp -s "$exe" target/release/herdvia
          check test "$(ls -A "$home/.local/bin")" = herdvia

          echo "--- plain http to another host"
          if env -i HOME="$work/home-http" PATH=/usr/bin:/bin:/usr/sbin:/sbin SHELL=/bin/zsh \
            HERDVIA_RELEASE_BASE=http://example.com/good HERDVIA_DIR="$work/d" HERDVIA_NO_AGENT=1 \
            sh scripts/install.sh > "$work/out5" 2>&1; then
            cat "$work/out5"
            echo "::error::install succeeded from a plain http release base"
            exit 1
          fi
          cat "$work/out5"
          check grep -q "HERDVIA_RELEASE_BASE must start with https://" "$work/out5"
          check test -z "$(grep '^Downloading ' "$work/out5")"
          check test ! -e "$work/home-http"

          echo "--- HOME with a space and a single quote"
          home="$work/it's home"
          exe=$home/.local/bin/herdvia
          mkdir "$home"
          run_install good sh scripts/install.sh > "$work/out4" 2>&1 || { cat "$work/out4"; exit 1; }
          cat "$work/out4"
          check grep -qxF "Installed herdvia $version at $exe" "$work/out4"
          # The printed commands, run as printed. Without an agent, herdvia itself fails with 255.
          listen=$(grep -x '  .* listen' "$work/out4" || true)
          connect=$(grep -x '  .* connect <name>' "$work/out4" | sed 's/<name>/B/g' || true)
          check test -n "$listen"
          check test -n "$connect"
          code=0
          HERDVIA_DIR="$work/d" sh -c "$listen" > "$work/listen.out" 2>&1 || code=$?
          cat "$work/listen.out"
          check test "$code" = 255
          check grep -q '^herdvia: ' "$work/listen.out"
          code=0
          HERDVIA_DIR="$work/d" sh -c "$connect" > "$work/connect.out" 2>&1 || code=$?
          cat "$work/connect.out"
          check test "$code" = 255
          check grep -q '^herdvia: ' "$work/connect.out"

          echo "--- doctor"
          # Read-only. No herdr-core and no agent here, so it reports failures and exits with 1.
          code=0
          env -i HOME="$home" PATH=/usr/bin:/bin:/usr/sbin:/sbin HERDVIA_DIR="$work/doctor" \
            "$exe" doctor > "$work/doctor.out" 2>&1 || code=$?
          cat "$work/doctor.out"
          check test "$code" = 1
          check grep -qF "executable: herdvia $version at $exe" "$work/doctor.out"
          check grep -q '^fail herdr-core: not found' "$work/doctor.out"
          check grep -q '^fail agent: ' "$work/doctor.out"
          check test -z "$(grep -Ev '^(ok   |warn |fail )' "$work/doctor.out")"
          check test ! -e "$work/doctor"

  install-ps1:
    needs: windows-cross
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: herdvia-windows-x64
          path: bin

      # Serves a release built like release.yml's from a local server and runs install.ps1 under
      # Windows PowerShell 5.1 and PowerShell 7, both with a Restricted execution policy. The
      # runner is elevated, so install.ps1 must skip herdvia agent install.
      - name: Test scripts/install.ps1
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$')[0].Matches[0].Groups[1].Value
          # In the profile, not RUNNER_TEMP: HERDVIA_DIR below is inside it, and herdvia refuses a
          # data folder whose parent folders another account may change.
          $work = Join-Path $env:LOCALAPPDATA "hv"
          $good = Join-Path $work "srv\good"
          $bad = Join-Path $work "srv\bad"
          $pkg = Join-Path $work "pkg"
          $fake = Join-Path $work "fake"
          New-Item -ItemType Directory -Force $good, $bad, $pkg, $fake | Out-Null
          Copy-Item bin\herdvia.exe, README.md, LICENSE-MIT, LICENSE-APACHE $pkg
          Set-Content (Join-Path $pkg "THIRD-PARTY-LICENSES.html") "test"
          Compress-Archive -Path "$pkg\*" -DestinationPath "$good\herdvia-windows-x64.zip"
          Copy-Item scripts\install.sh, scripts\install.ps1 $good
          $sums = foreach ($name in "herdvia-windows-x64.zip", "install.sh", "install.ps1") {
            "$((Get-FileHash (Join-Path $good $name) -Algorithm SHA256).Hash.ToLowerInvariant())  $name"
          }
          [IO.File]::WriteAllText("$good\SHA256SUMS", (($sums -join "`n") + "`n"))
          Get-Content "$good\SHA256SUMS"
          # A changed archive under the good archive's checksum.
          Copy-Item (Join-Path $env:SystemRoot "System32\where.exe") (Join-Path $fake "herdvia.exe")
          Compress-Archive -Path "$fake\*" -DestinationPath "$bad\herdvia-windows-x64.zip"
          Copy-Item "$good\SHA256SUMS", "$good\install.ps1" $bad
          # A release folder from which nothing else can be downloaded.
          $missing = Join-Path $work "srv\missing"
          New-Item -ItemType Directory -Force $missing | Out-Null
          Copy-Item "$good\install.ps1" $missing

          $server = Start-Process python -ArgumentList "-m", "http.server", "8765", "--bind", "127.0.0.1", "--directory", (Join-Path $work "srv") `
            -PassThru -NoNewWindow -RedirectStandardOutput "$work\http.out" -RedirectStandardError "$work\http.err"
          $base = "http://127.0.0.1:8765"
          for ($i = 0; $i -lt 50; $i++) {
            try { Invoke-WebRequest "$base/good/SHA256SUMS" -UseBasicParsing | Out-Null; break } catch { Start-Sleep -Milliseconds 200 }
          }
          Invoke-WebRequest "$base/good/SHA256SUMS" -UseBasicParsing | Out-Null

          # Children see a fresh profile; the user PATH in the registry does change.
          $user = Join-Path $work "user"
          $env:USERPROFILE = $user
          $env:LOCALAPPDATA = Join-Path $user "AppData\Local"
          $env:APPDATA = Join-Path $user "AppData\Roaming"
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA, $env:APPDATA | Out-Null
          $env:HERDVIA_DIR = Join-Path $work "d"
          $dir = Join-Path $env:LOCALAPPDATA "Programs\herdvia"
          $exe = Join-Path $dir "herdvia.exe"

          function Check($ok, $what) {
            if (-not $ok) { throw "check failed: $what" }
            Write-Host "ok: $what"
          }
          # $releaseBase: download from there instead of $base/$release.
          function Invoke-Install($shell, $release, $releaseBase) {
            $ErrorActionPreference = "Continue"
            $env:HERDVIA_RELEASE_BASE = if ($releaseBase) { $releaseBase } else { "$base/$release" }
            $log = Join-Path $work ("out-" + [IO.Path]::GetRandomFileName() + ".txt")
            & $shell -NoProfile -ExecutionPolicy Restricted -Command "Get-ExecutionPolicy; irm $base/$release/install.ps1 | iex" *> $log
            $code = $LASTEXITCODE
            $text = Get-Content -Raw $log
            Write-Host "--- $shell, $release (exit $code)"
            Write-Host $text
            Check ($text -match "(?m)^Restricted\r?$") "$shell ran with a Restricted execution policy"
            [pscustomobject]@{ Code = $code; Text = $text }
          }
          function Get-PathCount {
            $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey("Environment")
            $raw = [string]$key.GetValue("Path", "", [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
            $key.Close()
            @($raw -split ";" | Where-Object { $_ -ieq $dir }).Count
          }
          $built = (Get-FileHash bin\herdvia.exe -Algorithm SHA256).Hash

          try {
            $r = Invoke-Install powershell good
            Check ($r.Code -eq 0) "new install with Windows PowerShell 5.1 succeeds"
            Check (Test-Path -LiteralPath $exe) "herdvia.exe is at $exe"
            Check ((Get-FileHash $exe -Algorithm SHA256).Hash -eq $built) "herdvia.exe is the built executable"
            foreach ($name in "README.md", "LICENSE-MIT", "LICENSE-APACHE", "THIRD-PARTY-LICENSES.html") {
              Check (Test-Path -LiteralPath (Join-Path $dir $name)) "$name is installed"
            }
            Check ($r.Text -match "Installed herdvia $([regex]::Escape($version)) at") "reports the new install"
            Check ($r.Text -match "running as administrator") "skips herdvia agent install when elevated"
            Check ($r.Text -match "releases\.herdr\.dev/core/install\.ps1") "explains how to install herdr-core"
            Check ((& $exe --version) -eq "herdvia $version") "herdvia --version"
            $id = & $exe id
            Check ($LASTEXITCODE -eq 0 -and $id.Count -eq 2 -and $id[0] -match "^[0-9a-f]{64}$") "herdvia id"
            Check ($r.Text.Contains($id[0])) "install output shows the EndpointId"
            Check ((Get-PathCount) -eq 1) "user PATH lists the folder once"

            $r = Invoke-Install pwsh good
            Check ($r.Code -eq 0) "upgrade with PowerShell 7 succeeds"
            Check ($r.Text -match "Upgraded herdvia") "reports the upgrade"
            Check ((Get-PathCount) -eq 1) "user PATH still lists the folder once"
            Check (((& $exe id) -join "`n") -eq ($id -join "`n")) "identity is kept"

            # A running herdvia.exe cannot be overwritten; install.ps1 renames it aside.
            $agent = Start-Process $exe -ArgumentList "agent" -PassThru -NoNewWindow `
              -RedirectStandardOutput "$work\agent.out" -RedirectStandardError "$work\agent.err"
            Start-Sleep -Seconds 3
            if ($agent.HasExited) { Get-Content "$work\agent.err" }
            Check (-not $agent.HasExited) "agent is running from $exe"
            $r = Invoke-Install powershell good
            Check ($r.Code -eq 0) "upgrade while herdvia.exe is running succeeds"
            Check (-not $agent.HasExited) "agent is still running"
            Check (Test-Path -LiteralPath "$exe.old") "the running executable was renamed to herdvia.exe.old"
            Check ((& $exe --version) -eq "herdvia $version") "new herdvia.exe runs"
            Stop-Process -Id $agent.Id
            $agent.WaitForExit()
            $r = Invoke-Install pwsh good
            Check ($r.Code -eq 0) "upgrade after the agent stopped succeeds"
            Check (@(Get-ChildItem -LiteralPath $dir -Filter "herdvia.exe*.old").Count -eq 0) "herdvia.exe.old was removed"

            $r = Invoke-Install powershell bad
            Check ($r.Code -ne 0) "checksum mismatch fails"
            Check ($r.Text -match "checksum mismatch") "reports the checksum mismatch"
            Check ((Get-FileHash $exe -Algorithm SHA256).Hash -eq $built) "installed herdvia.exe is unchanged"
            Check (@(Get-ChildItem -LiteralPath $dir -Filter "herdvia.exe*.old").Count -eq 0) "nothing was renamed"
            Check (-not (Test-Path -LiteralPath (Join-Path $dir "herdvia.new.exe"))) "no herdvia.new.exe is left"

            # install.ps1 from here, but a release base on another host over plain http.
            $r = Invoke-Install powershell good "http://example.com/good"
            Check ($r.Code -ne 0) "a plain http release base on another host fails"
            Check ($r.Text -match "HERDVIA_RELEASE_BASE must start with https://") "reports that the release base must use https"
            Check ($r.Text -notmatch "(?m)^Downloading ") "nothing was downloaded"
            Check ((Get-FileHash $exe -Algorithm SHA256).Hash -eq $built) "installed herdvia.exe is unchanged"
            Check (-not (Test-Path -LiteralPath (Join-Path $dir "herdvia.new.exe"))) "no herdvia.new.exe is left"

            # An upgrade cut short: herdvia.exe is broken and the working one is herdvia.exe.old.
            Move-Item -LiteralPath $exe -Destination "$exe.old"
            Set-Content -LiteralPath $exe -Value "broken"
            $r = Invoke-Install powershell missing
            Check ($r.Code -ne 0) "a failed download after an interrupted upgrade fails"
            Check ($r.Text -match "download failed") "reports the failed download"
            Check ((Test-Path -LiteralPath "$exe.old") -and (Get-FileHash "$exe.old" -Algorithm SHA256).Hash -eq $built) "herdvia.exe.old is kept"
            Check (-not (Test-Path -LiteralPath (Join-Path $dir "herdvia.new.exe"))) "no herdvia.new.exe is left"
            $r = Invoke-Install pwsh good
            Check ($r.Code -eq 0) "installing again after an interrupted upgrade succeeds"
            Check ((Get-FileHash $exe -Algorithm SHA256).Hash -eq $built) "herdvia.exe is the built executable again"
            Check (@(Get-ChildItem -LiteralPath $dir -Filter "herdvia.exe*.old").Count -eq 0) "the renamed executables were removed"

            # The manual install in README.md, with its commands: the Windows block is read from
            # README.md and typed into Windows PowerShell 5.1 and PowerShell 7 (Restricted, as
            # by default), with only the download URL pointed here. Each run has its own
            # LOCALAPPDATA. System32 first, as on a PC without Git's Unix tools (whose tar cannot
            # read zip) on PATH. No PSModulePath, as in a new window: a 5.1 started by 7 would
            # otherwise load 7's modules.
            $env:Path = "$env:SystemRoot\System32;$env:Path"
            Check (@(Get-Command tar.exe)[0].Source -ieq "$env:SystemRoot\System32\tar.exe") "tar.exe is the one in Windows"
            $block = [regex]::Match((Get-Content -Raw README.md), '(?s)#### Windows \(x64\).*?```powershell\r?\n(.*?)```').Groups[1].Value
            $url = "https://github.com/photojupi/herdvia/releases/latest/download"
            Check ([regex]::Matches($block, [regex]::Escape("$url/")).Count -eq 2) "README.md has the Windows manual install block"
            $refusal = [regex]::Match($block, 'throw "(.+)"').Groups[1].Value
            Check ($refusal -ne "") "the block stops with throw"
            # A changed byte, an archive SHA256SUMS does not list, and no archive.
            $flipped = Join-Path $work "srv\manual-flipped"
            $unlisted = Join-Path $work "srv\manual-unlisted"
            $nozip = Join-Path $work "srv\manual-nozip"
            New-Item -ItemType Directory -Force $flipped, $unlisted, $nozip | Out-Null
            $bytes = [IO.File]::ReadAllBytes("$good\herdvia-windows-x64.zip")
            $i = [int]($bytes.Length / 2)
            $bytes[$i] = $bytes[$i] -bxor 1
            [IO.File]::WriteAllBytes("$flipped\herdvia-windows-x64.zip", $bytes)
            Copy-Item "$good\SHA256SUMS" $flipped
            Copy-Item "$good\SHA256SUMS" $nozip
            Copy-Item "$good\herdvia-windows-x64.zip" $unlisted
            $others = @(Get-Content "$good\SHA256SUMS" | Where-Object { $_ -notmatch "herdvia-windows-x64\.zip" })
            Check ($others.Count -eq 2) "SHA256SUMS without the archive keeps the other lines"
            [IO.File]::WriteAllText("$unlisted\SHA256SUMS", (($others -join "`n") + "`n"))
            function Invoke-Manual($shell, $release) {
              $ErrorActionPreference = "Continue"
              $env:LOCALAPPDATA = Join-Path $work "manual-$shell-$release\AppData\Local"
              New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
              $typed = Join-Path $work "manual-$shell-$release.txt"
              [IO.File]::WriteAllText($typed, $block.Replace($url, "$base/$release"))
              $log = "$typed.out"
              $modules = $env:PSModulePath
              Remove-Item Env:PSModulePath
              try {
                & $shell -NoProfile -ExecutionPolicy Restricted -Command ('Get-ExecutionPolicy; try { Get-Content -Raw -Encoding UTF8 ''' + $typed + ''' | Invoke-Expression } catch { ''thrown: '' + $_.Exception.Message; exit 1 }') *> $log
                $code = $LASTEXITCODE
              } finally {
                $env:PSModulePath = $modules
              }
              $text = Get-Content -Raw $log
              Write-Host "--- manual install, $shell, $release (exit $code)"
              Write-Host $text
              Check ($text -match "(?m)^Restricted\r?$") "$shell ran with a Restricted execution policy"
              [pscustomobject]@{ Code = $code; Text = $text; Dir = Join-Path $env:LOCALAPPDATA "Programs\herdvia" }
            }
            foreach ($shell in "powershell", "pwsh") {
              $r = Invoke-Manual $shell good
              Check ($r.Code -eq 0 -and $r.Text -notmatch "(?m)^thrown: ") "the manual install with $shell succeeds"
              foreach ($name in "README.md", "LICENSE-MIT", "LICENSE-APACHE", "THIRD-PARTY-LICENSES.html") {
                Check (Test-Path -LiteralPath (Join-Path $r.Dir $name)) "the manual install with $shell extracts $name"
              }
              Check ((Get-FileHash (Join-Path $r.Dir "herdvia.exe") -Algorithm SHA256).Hash -eq $built) "the herdvia.exe $shell extracted is the built executable"
              Check ((& (Join-Path $r.Dir "herdvia.exe") --version) -eq "herdvia $version") "the herdvia.exe $shell extracted runs"
              foreach ($release in "manual-flipped", "manual-unlisted", "manual-nozip") {
                $r = Invoke-Manual $shell $release
                Check ($r.Code -ne 0) "the manual install with $shell fails for $release"
                Check ($r.Text -match "(?m)^thrown: $([regex]::Escape($refusal))\r?$") "the manual install with $shell stops at the block's throw for $release"
                Check (-not (Test-Path -LiteralPath (Join-Path $env:LOCALAPPDATA "Programs"))) "the manual install with $shell creates no install folder for $release"
              }
            }

            # herdvia doctor only reads. No herdr-core or agent here, so it reports failures and exits with 1.
            $env:HERDVIA_DIR = Join-Path $work "doctor"
            $doctor = @(& $exe doctor)
            $code = $LASTEXITCODE
            $doctor | Write-Host
            Check ($code -eq 1) "herdvia doctor exits with 1"
            Check (@($doctor | Where-Object { $_ -match "^(ok  |warn) executable: herdvia $([regex]::Escape($version)) at .*\\herdvia\.exe(,|$)" }).Count -eq 1) "doctor shows the executable"
            Check (@($doctor | Where-Object { $_ -match "^fail herdr-core: not found" }).Count -eq 1) "doctor reports the missing herdr-core"
            Check (@($doctor | Where-Object { $_ -match "^fail agent: " }).Count -eq 1) "doctor reports the missing agent"
            Check (@($doctor | Where-Object { $_ -notmatch "^(ok   |warn |fail )" }).Count -eq 0) "every doctor line starts with ok, warn, or fail"
            Check (-not (Test-Path -LiteralPath $env:HERDVIA_DIR)) "doctor did not create the data folder"
            $env:HERDVIA_DIR = Join-Path $work "d"
          } finally {
            if ($agent -and -not $agent.HasExited) { Stop-Process -Id $agent.Id }
            Stop-Process -Id $server.Id
          }
          exit 0
