[package]
name = "herdvia"
version = "0.1.4"
edition = "2024"
description = "Unofficial iroh-based transport for Herdr's `hc machine add --via`: reach machines behind NAT without SSH or a VPN"
license = "MIT OR Apache-2.0"
repository = "https://github.com/photojupi/herdvia"
readme = "README.md"
publish = false

[dependencies]
blake3 = "1.8"
data-encoding = "2.11"
iroh = "~1.4.0"
socket2 = "0.6"
tokio = { version = "1", features = ["fs", "io-util", "io-std", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading"] }
